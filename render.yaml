# Render blueprint — one-click deploy for StockPilot.
#
# This file defines THREE services + a managed PostgreSQL database:
#   1. stockpilot-backend  — FastAPI API (port-managed by Render)
#   2. stockpilot-ai       — Roboflow proxy AI microservice
#   3. stockpilot-frontend — React static site
#   4. stockpilot-db       — PostgreSQL 16, free tier
#
# Push your repo to GitHub, then in Render: New ▸ Blueprint ▸ Connect repo.
# Render reads this file and provisions everything.
#
# After the first deploy, set the secret env vars in the Render dashboard
# for each service (any value marked `sync: false` below).

services:
  - type: web
    name: stockpilot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SMS_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: stockpilot-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ROBOFLOW_API_KEY
        sync: false                       # paste in Render dashboard
      - key: ROBOFLOW_WORKSPACE
        value: adeola-adebayo-s-workspace
      - key: ROBOFLOW_WORKFLOW
        value: yolo-world-medium-demo
      - key: ROBOFLOW_CLASSES
        value: "cement bag,iron rod,steel pipe,brick,sandcrete block,paint drum,plywood sheet,nail box,roofing sheet,gravel"
      - key: CONFIDENCE_THRESHOLD
        value: "0.15"
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: stockpilot-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE
        value: https://stockpilot-backend.onrender.com    # rename if you change service name
      - key: REACT_APP_AI_BASE
        value: https://stockpilot-ai.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: stockpilot-db
    plan: free
    databaseName: stockpilot
    user: stockpilot
